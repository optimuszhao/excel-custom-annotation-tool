{% extends "base.html" %}
{% block title %}模型对话{% endblock %}
{% block content %}
<div style="flex:1; min-height:0; display:flex; flex-direction:row;">
    <!-- 左侧：会话列表 -->
    <div style="width:220px; flex-shrink:0; display:flex; flex-direction:column; background:#f9fafb; border-right:1px solid #e5e7eb;">
        <!-- 新建对话按钮 -->
        <div style="padding:12px;">
            <button id="newChatBtn" style="width:100%; padding:10px 16px; background:#2563eb; color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; transition:background 0.15s;" onmouseover="this.style.background='#1d4ed8'" onmouseout="this.style.background='#2563eb'">
                <svg style="width:16px; height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                新建对话
            </button>
        </div>
        <!-- 会话列表区域 -->
        <div id="sessionList" style="flex:1; overflow-y:auto; padding:0 8px 12px;"></div>
    </div>

    <!-- 右侧：对话区 -->
    <div style="flex:1; min-width:0; display:flex; flex-direction:column; background:#ffffff;">
        <!-- 顶部：模型选择 -->
        <div style="padding:12px 20px; border-bottom:1px solid #e5e7eb; display:flex; align-items:center; gap:12px; flex-shrink:0;">
            <svg style="width:18px; height:18px; color:#6b7280;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            <select id="modelSelect" style="padding:6px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; background:#fff; outline:none; min-width:160px; cursor:pointer;" onfocus="this.style.boxShadow='0 0 0 2px #3b82f6'" onblur="this.style.boxShadow='none'"></select>
            <div id="currentSessionInfo" style="margin-left:auto; font-size:12px; color:#9ca3af;"></div>
        </div>

        <!-- 消息列表 -->
        <div id="messageArea" style="flex:1; overflow-y:auto; padding:20px 24px;">
            <div id="emptyState" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#9ca3af;">
                <svg style="width:48px; height:48px; margin-bottom:16px; opacity:0.4;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                <p style="font-size:15px; margin:0;">选择模型并开始新对话</p>
                <p style="font-size:13px; margin-top:6px;">Shift + Enter 换行，Enter 发送</p>
            </div>
        </div>

        <!-- 输入区域 -->
        <div style="padding:12px 24px 16px; border-top:1px solid #f3f4f6; flex-shrink:0;">
            <div style="display:flex; align-items:flex-end; gap:10px; background:#f9fafb; border:1px solid #e5e7eb; border-radius:12px; padding:8px 12px; transition:border-color 0.15s;" id="inputWrapper">
                <textarea id="chatInput" style="flex:1; border:none; outline:none; background:transparent; font-size:14px; line-height:1.5; resize:none; min-height:24px; max-height:120px; padding:4px 0; font-family:inherit; color:#1f2937;" rows="1" placeholder="输入消息..."></textarea>
                <button id="sendBtn" style="flex-shrink:0; width:36px; height:36px; background:#2563eb; color:#fff; border:none; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.15s;" onmouseover="this.style.background='#1d4ed8'" onmouseout="this.style.background='#2563eb'">
                    <svg style="width:18px; height:18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V5m0 0l-7 7m7-7l7 7"></path></svg>
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/model_chat.js"></script>
{% endblock %}
