<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}数据飞轮{% endblock %} - AI标注平台</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>">
    <link rel="stylesheet" href="/static/tailwind.css">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50" style="height:100vh; overflow:hidden; display:flex; flex-direction:row;">
        <!-- 同步状态滚动横幅 -->
        <div id="sync-banner" style="position:fixed; top:0; left:0; width:100%; height:28px; background:#3b82f6; color:white; font-size:12px; text-align:center; line-height:28px; z-index:9999; transform:translateY(-100%); transition:transform 0.3s; overflow:hidden; white-space:nowrap;">
            <span id="sync-banner-text">数据同步中...</span>
        </div>

        <!-- 左侧菜单 -->
        <aside style="width:176px; flex-shrink:0; height:100vh; overflow-y:auto; border-right:1px solid #e5e7eb; background:white; display:flex; flex-direction:column;">
            <!-- Logo 区域 -->
            <div style="padding:16px; border-bottom:1px solid #f3f4f6; flex-shrink:0;">
                <h1 style="font-size:15px; font-weight:700; color:#111827; margin:0; display:flex; align-items:center; gap:8px;">
                    <svg style="width:20px; height:20px; color:#2563eb;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    数据飞轮
                </h1>
            </div>
            <!-- 导航菜单 -->
            <nav style="flex:1; overflow-y:auto; padding:8px 0;">
                <a href="/" class="nav-item {% if active_page == 'excel' %}nav-item--active{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Excel 数据管理
                </a>
                <a href="/workbench" class="nav-item {% if active_page == 'workbench' %}nav-item--active{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    标注工作台
                </a>
                <a href="/prompt-manage" class="nav-item {% if active_page == 'prompt' %}nav-item--active{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    Prompt 管理
                </a>
                <a href="/knowledge-manage" class="nav-item {% if active_page == 'knowledge' %}nav-item--active{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    知识管理
                </a>
                <a href="/rule-config" class="nav-item {% if active_page == 'rule' %}nav-item--active{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    规则配置
                </a>
                <a href="/error-book" class="nav-item {% if active_page == 'error_book' %}nav-item--active{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path></svg>
                    错题本
                </a>
                <a href="/model-chat" class="nav-item {% if active_page == 'chat' %}nav-item--active{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    模型对话
                </a>

            </nav>
        </aside>

        <!-- 右侧主内容 -->
        <main style="flex:1; min-height:0; min-width:0; display:flex; flex-direction:column; overflow:hidden;">
            {% block content %}{% endblock %}
        </main>

    <!-- Toast 通知容器 -->
    <div id="toast-container" style="position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;"></div>
    
    <!-- 全局加载遮罩 -->
    <div id="global-loading" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:40; align-items:center; justify-content:center;">
        <div style="background:#fff; border-radius:0.5rem; padding:1.5rem; box-shadow:0 4px 16px rgba(0,0,0,0.15); display:flex; align-items:center; gap:0.75rem;">
            <svg style="animation:spin 1s linear infinite; height:1.5rem; width:1.5rem; color:#2563eb;" fill="none" viewBox="0 0 24 24">
                <circle style="opacity:0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path style="opacity:0.75;" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span style="color:#374151;" id="loading-text">加载中...</span>
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div id="confirm-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:50; align-items:center; justify-content:center;">
        <div style="background:#fff; border-radius:0.5rem; padding:1.5rem; box-shadow:0 4px 16px rgba(0,0,0,0.15); max-width:28rem; width:100%; margin:0 1rem;">
            <h3 id="confirm-title" style="font-size:1.125rem; font-weight:600; color:#1f2937; margin-bottom:0.5rem;"></h3>
            <p id="confirm-message" style="color:#4b5563; margin-bottom:1.5rem;"></p>
            <div style="display:flex; justify-content:flex-end; gap:0.75rem;">
                <button id="confirm-cancel-btn" style="padding:0.5rem 1rem; color:#4b5563; background:#f3f4f6; border:none; border-radius:0.5rem; cursor:pointer; font-size:0.875rem;">取消</button>
                <button id="confirm-ok-btn" style="padding:0.5rem 1rem; color:#fff; background:#2563eb; border:none; border-radius:0.5rem; cursor:pointer; font-size:0.875rem;">确认</button>
            </div>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/components.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
