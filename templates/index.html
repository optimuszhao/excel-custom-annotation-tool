{% extends "base.html" %}
{% block title %}Excel 数据管理{% endblock %}

{% block content %}
<div class="p-6" style="flex:1; overflow-y:auto;">
    <!-- 顶部工具栏 -->
    <div class="flex justify-between items-center mb-6">
        <h2 style="font-size:20px; font-weight:700; color:#1f2937;">Excel 数据管理</h2>
        <div class="flex gap-3">
            <button id="refreshAllBtn" class="btn-secondary">全局刷新本地Excel</button>
            <button id="uploadBtn" style="display:inline-flex; align-items:center; gap:6px; padding:8px 16px; background:linear-gradient(135deg, #2563eb, #1d4ed8); color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; box-shadow:0 2px 4px rgba(37,99,235,0.3); transition:all 0.2s;"
                onmouseover="this.style.boxShadow='0 4px 8px rgba(37,99,235,0.4)'; this.style.transform='translateY(-1px)'"
                onmouseout="this.style.boxShadow='0 2px 4px rgba(37,99,235,0.3)'; this.style.transform='translateY(0)'">
                <svg style="width:16px;height:16px;flex-shrink:0;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                新增 Excel 数据源
            </button>
        </div>
    </div>

    <!-- 场景过滤 + 搜索 -->
    <div class="flex items-center gap-3 mb-4">
        <select id="sceneFilter" class="form-select" style="width: 12rem;">
            <option value="">全部场景</option>
        </select>
        <input type="text" id="searchInput" class="form-input" style="width: 16rem;" placeholder="搜索文件名...">
    </div>

    <!-- 数据表格 -->
    <div class="card">
        <table class="data-table" id="excelTable">
            <thead>
                <tr>
                    <th>序号</th>
                    <th class="cursor-pointer" data-sort="file_name">文件名 ↕</th>
                    <th class="cursor-pointer" data-sort="total_rows">总行数 ↕</th>
                    <th>已标注数量</th>
                    <th>包含的列信息</th>
                    <th>所属场景</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="excelTableBody"></tbody>
        </table>
        <!-- 空状态 -->
        <div id="emptyState" class="empty-state" style="display:none;">
            <p class="empty-state__text">暂无数据，请上传Excel文件</p>
        </div>
    </div>

    <!-- 分页 -->
    <div id="pagination"></div>
</div>

<!-- 上传弹窗 -->
<div id="uploadModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:50; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:0.5rem; padding:1.5rem; box-shadow:0 4px 16px rgba(0,0,0,0.15); width:500px; max-width:90vw;">
        <h3 style="font-size:1rem; font-weight:600; margin-bottom:1rem;">新增 Excel 数据源</h3>
        <div style="display:flex; flex-direction:column; gap:1rem;">
            <div>
                <label class="form-label">选择文件</label>
                <div id="file-upload-area" style="border:2px dashed #d1d5db; border-radius:10px; padding:28px 20px; text-align:center; cursor:pointer; transition:border-color 0.2s, background 0.2s;"
                     ondragover="event.preventDefault(); this.style.borderColor='#2563eb'; this.style.background='#eff6ff';"
                     ondragleave="this.style.borderColor='#d1d5db'; this.style.background='transparent';"
                     ondrop="handleFileDrop(event)"
                     onclick="document.getElementById('fileInput').click();">
                    <div id="file-upload-placeholder">
                        <svg style="width:36px; height:36px; color:#9ca3af; margin:0 auto 8px; display:block;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                        </svg>
                        <p style="font-size:13px; color:#6b7280; margin:0;">点击或拖拽文件到此处</p>
                        <p style="font-size:11px; color:#9ca3af; margin:4px 0 0;">支持 .xlsx, .xls 格式</p>
                    </div>
                    <div id="file-upload-info" style="display:none;">
                        <div style="display:flex; align-items:center; justify-content:center; gap:8px;">
                            <svg style="width:20px; height:20px; color:#16a34a;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            <span id="file-name-display" style="font-size:13px; color:#111827; font-weight:500;"></span>
                        </div>
                        <p id="file-size-display" style="font-size:11px; color:#9ca3af; margin:4px 0 0;"></p>
                    </div>
                </div>
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none;" onchange="handleFileSelect(this)">
            </div>
            <div>
                <label class="form-label">所属场景</label>
                <select id="uploadSceneSelect" class="form-select"></select>
            </div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1.5rem;">
            <button id="uploadCancelBtn" class="btn-secondary">取消</button>
            <button id="uploadConfirmBtn" class="btn-primary">上传</button>
        </div>
    </div>
</div>

<!-- 修改文件名弹窗 -->
<div id="renameModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:50; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:0.5rem; padding:1.5rem; box-shadow:0 4px 16px rgba(0,0,0,0.15); width:400px; max-width:90vw;">
        <h3 style="font-size:1rem; font-weight:600; margin-bottom:1rem;">修改文件名</h3>
        <div>
            <label class="form-label">新文件名</label>
            <input type="text" id="renameInput" class="form-input" placeholder="请输入新文件名">
        </div>
        <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1.5rem;">
            <button id="renameCancelBtn" class="btn-secondary">取消</button>
            <button id="renameConfirmBtn" class="btn-primary">确认</button>
        </div>
    </div>
</div>

<!-- 设定显示列弹窗 -->
<div id="displayColumnsModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:50; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:0.5rem; padding:1.5rem; box-shadow:0 4px 16px rgba(0,0,0,0.15); width:500px; max-width:90vw;">
        <h3 style="font-size:1rem; font-weight:600; margin-bottom:1rem;">设定显示列</h3>
        <div id="displayColumnsList" style="display:flex; flex-direction:column; gap:0.5rem; max-height:20rem; overflow-y:auto;">
            <!-- 列名复选框由JS渲染 -->
        </div>
        <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1.5rem;">
            <button id="displayColumnsCancelBtn" class="btn-secondary">取消</button>
            <button id="displayColumnsConfirmBtn" class="btn-primary">确认</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/excel_manage.js"></script>
{% endblock %}
