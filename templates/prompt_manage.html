{% extends "base.html" %}

{% block title %}Prompt 管理{% endblock %}

{% block head %}
<style>
    /* 三栏布局 */
    .pm-layout {
        display: flex;
        flex: 1;
        min-height: 0;
        overflow: hidden;
    }
    .pm-sidebar {
        width: 200px;
        min-width: 200px;
        border-right: 1px solid #e5e7eb;
        display: flex;
        flex-direction: column;
        background: #fff;
    }
    .pm-sidebar-header {
        padding: 1rem;
        border-bottom: 1px solid #e5e7eb;
        font-weight: 600;
        font-size: 0.875rem;
        color: #374151;
    }
    .pm-sidebar-list {
        flex: 1;
        overflow-y: auto;
        padding: 0.5rem;
    }
    .pm-sidebar-item {
        padding: 0.5rem 0.75rem;
        border-radius: 0.375rem;
        cursor: pointer;
        font-size: 0.875rem;
        color: #4b5563;
        transition: all 150ms;
        margin-bottom: 2px;
    }
    .pm-sidebar-item:hover {
        background-color: #f3f4f6;
    }
    .pm-sidebar-item--active {
        background-color: #eff6ff;
        color: #1d4ed8;
        font-weight: 500;
    }
    .pm-sidebar-add {
        padding: 0.5rem;
        border-top: 1px solid #e5e7eb;
    }

    /* 中间文件列表 */
    .pm-file-panel {
        width: 260px;
        min-width: 260px;
        border-right: 1px solid #e5e7eb;
        display: flex;
        flex-direction: column;
        background: #fff;
    }
    .pm-file-header {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .pm-file-header-title {
        font-weight: 600;
        font-size: 0.875rem;
        color: #374151;
    }
    .pm-file-count {
        font-size: 0.75rem;
        color: #9ca3af;
    }
    .pm-file-list {
        flex: 1;
        overflow-y: auto;
        padding: 0.5rem;
    }
    .pm-file-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.625rem 0.75rem;
        border-radius: 0.375rem;
        cursor: pointer;
        font-size: 0.875rem;
        color: #4b5563;
        transition: all 150ms;
        margin-bottom: 2px;
    }
    .pm-file-item:hover {
        background-color: #f3f4f6;
    }
    .pm-file-item--active {
        background-color: #eff6ff;
        color: #1d4ed8;
    }
    .pm-file-info {
        flex: 1;
        min-width: 0;
    }
    .pm-file-name {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .pm-file-type {
        font-size: 0.75rem;
        color: #9ca3af;
    }
    .pm-file-actions {
        display: flex;
        gap: 0.25rem;
        opacity: 0;
        transition: opacity 150ms;
    }
    .pm-file-item:hover .pm-file-actions {
        opacity: 1;
    }
    .pm-file-action-btn {
        padding: 0.25rem;
        border-radius: 0.25rem;
        cursor: pointer;
        color: #6b7280;
        transition: all 150ms;
        background: none;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .pm-file-action-btn:hover {
        background-color: #e5e7eb;
        color: #374151;
    }
    .pm-file-action-btn--danger:hover {
        background-color: #fee2e2;
        color: #dc2626;
    }
    .pm-file-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3rem 1rem;
        color: #9ca3af;
        font-size: 0.875rem;
    }

    /* 右侧编辑区 */
    .pm-editor {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #fff;
        min-width: 0;
    }
    .pm-editor-header {
        padding: 0.75rem 1.5rem;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .pm-editor-title-group {
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }
    .pm-editor-title {
        font-weight: 600;
        font-size: 1rem;
        color: #111827;
    }
    .pm-editor-type {
        font-size: 0.75rem;
        color: #6b7280;
        background: #f3f4f6;
        padding: 0.125rem 0.5rem;
        border-radius: 9999px;
    }
    .pm-editor-actions {
        display: flex;
        gap: 0.5rem;
    }
    .pm-editor-body {
        flex: 1;
        padding: 1rem 1.5rem;
        overflow: hidden;
        display: flex;
    }
    .pm-editor-textarea {
        width: 100%;
        height: 100%;
        padding: 1rem;
        border: 1px solid #e5e7eb;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
        line-height: 1.6;
        resize: none;
        outline: none;
        transition: box-shadow 150ms;
        color: #1f2937;
        background: #fafafa;
    }
    .pm-editor-textarea:focus {
        box-shadow: 0 0 0 2px #3b82f6;
        border-color: transparent;
        background: #fff;
    }
    .pm-editor-textarea:disabled {
        background: #f9fafb;
        color: #9ca3af;
        cursor: not-allowed;
    }
    .pm-editor-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        color: #9ca3af;
        font-size: 0.875rem;
    }

    /* 工具栏 */
    .pm-toolbar {
        padding: 0.75rem 1.5rem;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: #fafafa;
    }

    /* 新增弹窗 */
    .pm-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.4);
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
    }
    .pm-modal-overlay.is-visible {
        display: flex;
    }
    .pm-modal {
        background: #fff;
        border-radius: 0.75rem;
        box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        width: 420px;
        max-width: 90vw;
    }
    .pm-modal-header {
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid #e5e7eb;
        font-weight: 600;
        font-size: 1rem;
        color: #111827;
    }
    .pm-modal-body {
        padding: 1.5rem;
    }
    .pm-modal-footer {
        padding: 1rem 1.5rem;
        border-top: 1px solid #e5e7eb;
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
    }
    .pm-form-group {
        margin-bottom: 1rem;
    }
    .pm-form-group:last-child {
        margin-bottom: 0;
    }
    .pm-form-label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        color: #374151;
        margin-bottom: 0.375rem;
    }

    /* 检查结果 */
    .pm-check-result {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #e5e7eb;
    }
    .pm-check-item {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        font-size: 0.875rem;
        margin-bottom: 0.375rem;
    }
    .pm-check-item--pass {
        color: #16a34a;
    }
    .pm-check-item--fail {
        color: #dc2626;
    }
    .pm-check-item--warn {
        color: #d97706;
    }

    /* 场景编辑弹窗 */
    .scene-edit-modal {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.4);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .scene-edit-modal__card {
        background: #fff;
        border-radius: 12px;
        padding: 24px;
        width: 400px;
        max-width: 90vw;
        box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .scene-edit-modal__title {
        font-size: 16px;
        font-weight: 600;
        color: #1f2937;
        margin-bottom: 16px;
    }
    .scene-edit-modal__actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
    }
    .scene-edit-modal__btn {
        padding: 6px 16px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        border: 1px solid #d1d5db;
        background: #fff;
        color: #374151;
        transition: all 0.15s;
    }
    .scene-edit-modal__btn:hover {
        background: #f9fafb;
    }
    .scene-edit-modal__btn--primary {
        background: #3b82f6;
        color: #fff;
        border-color: #3b82f6;
    }
    .scene-edit-modal__btn--primary:hover {
        background: #2563eb;
    }
</style>
{% endblock %}

{% block content %}
<div class="pm-layout">
    <!-- 左侧：场景列表 -->
    <div class="pm-sidebar">
        <div class="pm-sidebar-header">场景列表</div>
        <div class="pm-sidebar-list" id="scene-list">
            <!-- 动态渲染 -->
        </div>
        <div class="pm-sidebar-add">
            <button class="btn-secondary w-full text-sm" onclick="handleAddScene()">
                + 新增场景
            </button>
        </div>
    </div>

    <!-- 中间：Prompt文件列表 -->
    <div class="pm-file-panel">
        <div class="pm-file-header">
            <span class="pm-file-header-title">Prompt 文件</span>
            <span class="pm-file-count" id="prompt-count"></span>
        </div>
        <div class="pm-file-list" id="prompt-list">
            <div class="pm-file-empty" id="prompt-empty">
                <svg class="w-10 h-10 mb-2 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span>请先选择场景</span>
            </div>
        </div>
    </div>

    <!-- 右侧：编辑区 -->
    <div class="pm-editor">
        <!-- 工具栏 -->
        <div class="pm-toolbar" id="editor-toolbar">
            <button class="btn-primary btn-sm" onclick="handleAddPrompt()" id="btn-add-prompt">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                新增
            </button>
            <button class="btn-secondary btn-sm" onclick="handleSyncLocal()" id="btn-sync-local">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                同步本地
            </button>
            <button class="btn-secondary btn-sm" onclick="handleCheckPrompt()" id="btn-check-prompt">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                规则检查
            </button>
        </div>

        <!-- 检查结果区（默认隐藏） -->
        <div class="pm-check-result" id="check-result-area" style="display:none;"></div>

        <!-- 编辑器头部 -->
        <div class="pm-editor-header" id="editor-header" style="display: none;">
            <div class="pm-editor-title-group">
                <span class="pm-editor-title" id="editor-prompt-name"></span>
                <span class="pm-editor-type" id="editor-prompt-type"></span>
                <span id="editor-prompt-role-tag" style="display:none; font-size:11px; color:#6b7280; background:#f3f4f6; padding:1px 6px; border-radius:4px;"></span>
                <input type="text" id="editor-role-name-input" placeholder="角色名字" style="display:none; font-size:12px; border:1px solid #e5e7eb; border-radius:4px; padding:2px 8px; width:120px; outline:none;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#e5e7eb'">
            </div>
            <div class="pm-editor-actions">
                <button class="btn-primary btn-sm" onclick="handleSavePrompt()">保存</button>
                <button class="btn-secondary btn-sm" onclick="handleCancelEdit()">取消</button>
            </div>
        </div>

        <!-- 编辑器主体 -->
        <div class="pm-editor-body" id="editor-body">
            <div class="pm-editor-placeholder" id="editor-placeholder">
                <svg class="w-16 h-16 mb-3 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                <span>选择或创建一个 Prompt 文件开始编辑</span>
            </div>
            <textarea class="pm-editor-textarea" id="editor-content" style="display:none;" placeholder="在此输入 Prompt 内容...&#10;&#10;使用 {字段名} 作为占位符，例如：{chat_question}"></textarea>
        </div>
    </div>
</div>

<!-- 新增 Prompt 弹窗 -->
<div class="pm-modal-overlay" id="add-prompt-modal" style="display:none;">
    <div class="pm-modal">
        <div class="pm-modal-header">新增 Prompt</div>
        <div class="pm-modal-body">
            <div class="pm-form-group">
                <label class="pm-form-label">Prompt 名称</label>
                <input type="text" class="form-input" id="new-prompt-name" placeholder="例如：api_check" autocomplete="off">
            </div>
            <div class="pm-form-group">
                <label class="pm-form-label">角色名字（选填）</label>
                <input type="text" class="form-input" id="new-prompt-role-name" placeholder="例如：审核员、判题专家" autocomplete="off">
            </div>
            <div class="pm-form-group">
                <label class="pm-form-label">文件类型</label>
                <select class="form-select" id="new-prompt-file-type">
                    <option value=".prompt">.prompt</option>
                    <option value=".txt">.txt</option>
                </select>
            </div>
        </div>
        <div class="pm-modal-footer">
            <button class="btn-secondary btn-sm" onclick="closeAddModal()">取消</button>
            <button class="btn-primary btn-sm" onclick="submitNewPrompt()">创建</button>
        </div>
    </div>
</div>

<!-- 场景编辑弹窗 -->
<div class="scene-edit-modal" id="scene-edit-modal" style="display:none;">
    <div class="scene-edit-modal__card">
        <div class="scene-edit-modal__title" id="scene-modal-title">新增场景</div>
        <div class="pm-form-group" style="margin-bottom:12px;">
            <label class="pm-form-label">场景名称</label>
            <input type="text" class="form-input" id="scene-modal-name" placeholder="请输入场景名称">
        </div>
        <div class="pm-form-group" style="margin-bottom:0;">
            <label class="pm-form-label">场景描述</label>
            <textarea class="form-input" id="scene-modal-desc" placeholder="请输入场景描述（选填）" rows="3" style="resize:vertical;"></textarea>
        </div>
        <div class="scene-edit-modal__actions">
            <button class="scene-edit-modal__btn" id="scene-modal-cancel">取消</button>
            <button class="scene-edit-modal__btn scene-edit-modal__btn--primary" id="scene-modal-confirm">确认</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/prompt_manage.js"></script>
{% endblock %}
